name = "reguverse-learn-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"

routes = [
  { pattern = "learn-api.team-ra.org", custom_domain = true }
]

[vars]
ALLOWED_ORIGIN = "https://docs.team-ra.org"
DOCMCP_API_URL = "https://llm.team-ra.org"

# D1 database_id filled after `wrangler d1 create reguverse-learn`
[[d1_databases]]
binding = "DB"
database_name = "reguverse-learn"
database_id = "c88b0186-d7a3-4b94-b8b7-bb5035df9ab0"

# Secrets (wrangler secret put):
# HUB_TOKEN_SECRET -- same value as hub-api for account link interoperability
# HOST_CREATE_SECRET -- optional gate for creating live sessions (empty = open create)
